[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attribution-attack-analysis"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "PyYAML",
    "plotly",
    "soundfile",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]