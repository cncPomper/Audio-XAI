# AST training configuration
# Pass machine-specific paths via CLI:
#   --data-root $DATA_ROOT --train-csv $DATA_ROOT/train.csv \
#   --val-csv $DATA_ROOT/valid.csv --out-dir $OUT_DIR

seed: 42
clip_seconds: 5.0

model:
  name: ast

training:
  batch_size: 64
  epochs: 10
  lr: 1.0e-4
  num_workers: 16

cluster:
  num_nodes: 1
  devices: 1
  strategy: auto
  no_auto_requeue: false